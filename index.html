<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rona shop — عطور فاخرة</title>
<meta name="description" content="Rona shop — عطور شرقية فاخرة: مسك، عود وبخور. التوصيل لجميع المدن المغربية والدفع عند الاستلام.">
<style>
  :root {
    --black: #0d0b08; --coal: #161310; --coal2: #1e1a15;
    --gold: #c9a227; --gold-l: #e8c766; --gold-d: #9a7b1c;
    --cream: #f7f1e3; --ivory: #efe6d0; --muted: #a89a7d;
    --white: #fff; --green: #1F9D55; --red: #c0392b;
    --wa: #25D366;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Segoe UI', Tahoma, system-ui, sans-serif; background: var(--black); color: var(--cream); }
  h1, h2, h3, .serif { font-family: Georgia, 'Times New Roman', serif; }
  img { display: block; }

  /* ---------- ANNOUNCEMENT ---------- */
  .announce { background: linear-gradient(90deg, #0d0b08, #2a2214, #0d0b08); color: var(--gold-l);
    text-align: center; font-size: 0.82rem; padding: 0.55rem 1rem; letter-spacing: 0.04rem; font-weight: 600;
    border-bottom: 1px solid rgba(201,162,39,0.25); }

  /* ---------- NAV ---------- */
  nav { position: sticky; top: 0; z-index: 50; background: rgba(13,11,8,0.96);
    backdrop-filter: blur(10px); border-bottom: 1px solid rgba(201,162,39,0.25);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.7rem 1.4rem; gap: 0.8rem; }
  .logo { display: flex; align-items: center; gap: 0.6rem; white-space: nowrap; }
  .logo .mono { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-family: Georgia, serif; font-size: 1.3rem; color: var(--gold-l);
    background: radial-gradient(circle at 35% 30%, #2a2214, #0d0b08); }
  .logo .name { font-family: Georgia, serif; font-size: 1.15rem; letter-spacing: 0.14rem;
    color: var(--cream); font-weight: 700; }
  .logo .name span { color: var(--gold); }
  .nav-links { display: flex; gap: 1.2rem; align-items: center; }
  .nav-links a { color: var(--ivory); text-decoration: none; font-size: 0.92rem; font-weight: 500; }
  .nav-links a:hover { color: var(--gold-l); }
  .lang-sw { display: flex; border: 1px solid rgba(201,162,39,0.4); border-radius: 99px; overflow: hidden; }
  .lang-sw button { background: transparent; border: none; color: var(--muted); font-size: 0.75rem;
    font-weight: 700; padding: 0.42rem 0.7rem; cursor: pointer; letter-spacing: 0.03rem; }
  .lang-sw button.active { background: var(--gold); color: #0d0b08; }
  .cart-btn { position: relative; background: linear-gradient(135deg, var(--gold-l), var(--gold-d));
    border: none; color: #0d0b08; font-size: 1.1rem; width: 44px; height: 44px;
    border-radius: 50%; cursor: pointer; transition: transform 0.2s; }
  .cart-btn:hover { transform: scale(1.06); }
  .cart-count { position: absolute; top: -5px; right: -5px; background: var(--red); color: #fff;
    font-size: 0.7rem; min-width: 20px; height: 20px; border-radius: 99px;
    display: flex; align-items: center; justify-content: center; padding: 0 5px; font-weight: 700; }
  [dir="rtl"] .cart-count { right: auto; left: -5px; }

  /* ---------- HERO ---------- */
  .hero { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 3rem; align-items: center;
    max-width: 1200px; margin: 0 auto; padding: 4rem 1.6rem 3.5rem;
    background: radial-gradient(ellipse 60% 55% at 25% 30%, rgba(201,162,39,0.12) 0%, transparent 70%); }
  .hero .kicker { color: var(--gold-l); letter-spacing: 0.22rem; text-transform: uppercase;
    font-size: 0.78rem; font-weight: 700; margin-bottom: 1rem; }
  .hero h1 { font-size: 3rem; line-height: 1.25; margin-bottom: 1.1rem; color: var(--cream); }
  .hero h1 em { color: var(--gold-l); font-style: italic; }
  .hero p { color: var(--muted); font-size: 1.05rem; line-height: 1.8; margin-bottom: 1.8rem; max-width: 480px; }
  .hero-cta { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 2rem; }
  .btn { display: inline-block; background: var(--gold); color: #0d0b08; border: none;
    padding: 0.95rem 2.2rem; border-radius: 99px; font-weight: 700; font-size: 1rem;
    cursor: pointer; text-decoration: none; transition: transform 0.2s, box-shadow 0.2s; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(201,162,39,0.35); }
  .btn-gold { background: linear-gradient(135deg, var(--gold-l), var(--gold-d)); color: #0d0b08;
    box-shadow: 0 8px 22px rgba(201,162,39,0.3); }
  .btn-outline { background: transparent; color: var(--cream); border: 2px solid rgba(201,162,39,0.5); }
  .btn-outline:hover { border-color: var(--gold-l); }
  .hero-stats { display: flex; gap: 2rem; }
  .hero-stats div b { font-size: 1.4rem; display: block; color: var(--gold-l); }
  .hero-stats div span { font-size: 0.82rem; color: var(--muted); }
  .hero-visual { position: relative; }
  .hero-art { width: 100%; border-radius: 24px; aspect-ratio: 1/1; object-fit: cover;
    border: 1px solid rgba(201,162,39,0.35); box-shadow: 0 30px 60px rgba(0,0,0,0.6); }
  .float-card { position: absolute; background: var(--coal2); border: 1px solid rgba(201,162,39,0.35);
    border-radius: 14px; padding: 0.7rem 1rem; color: var(--cream);
    box-shadow: 0 12px 30px rgba(0,0,0,0.5); font-size: 0.85rem; font-weight: 600;
    display: flex; align-items: center; gap: 0.5rem; animation: float 3.5s ease-in-out infinite; }
  .float-card .stars { color: var(--gold-l); }
  .fc1 { top: 1.2rem; left: -1rem; }
  .fc2 { bottom: 1.4rem; right: -0.6rem; animation-delay: 1.7s; }
  [dir="rtl"] .fc1 { left: auto; right: -1rem; }
  [dir="rtl"] .fc2 { right: auto; left: -0.6rem; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

  /* ---------- TRUST ---------- */
  .trust { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem;
    max-width: 1100px; margin: 0 auto; padding: 0 1.4rem 1rem; }
  .trust div { background: var(--coal); border-radius: 14px; padding: 1.2rem 0.8rem; text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4); font-size: 0.85rem; border: 1px solid rgba(201,162,39,0.2); }
  .trust .ico { font-size: 1.6rem; display: block; margin-bottom: 0.4rem; }
  .trust b { display: block; margin-bottom: 0.2rem; color: var(--cream); }
  .trust span { color: var(--muted); font-size: 0.78rem; }

  /* ---------- SHOP ---------- */
  .shop { max-width: 1200px; margin: 0 auto; padding: 3rem 1.4rem 3.5rem; }
  .section-head { text-align: center; margin-bottom: 1.8rem; }
  .section-head .kicker { color: var(--gold-l); letter-spacing: 0.22rem; text-transform: uppercase;
    font-size: 0.75rem; font-weight: 700; margin-bottom: 0.6rem; }
  .section-head h2 { font-size: 2.1rem; margin-bottom: 0.4rem; color: var(--cream); }
  .section-head p { color: var(--muted); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center;
    align-items: center; margin-bottom: 2rem; }
  .toolbar input { padding: 0.65rem 1.2rem; border-radius: 99px; border: 1.5px solid rgba(201,162,39,0.35);
    background: var(--coal); color: var(--cream); font-size: 0.95rem; width: min(300px, 90vw); outline: none; }
  .toolbar input::placeholder { color: var(--muted); }
  .toolbar input:focus { border-color: var(--gold); }
  .pill { padding: 0.55rem 1.15rem; border-radius: 99px; border: 1.5px solid rgba(201,162,39,0.35);
    background: var(--coal); cursor: pointer; font-size: 0.88rem; transition: all 0.2s; color: var(--ivory); }
  .pill:hover { border-color: var(--gold-l); }
  .pill.active { background: linear-gradient(135deg, var(--gold-l), var(--gold-d)); border-color: var(--gold-d);
    color: #0d0b08; font-weight: 700; }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.4rem; }
  .card { background: var(--coal); border-radius: 18px; overflow: hidden; cursor: pointer;
    box-shadow: 0 4px 18px rgba(0,0,0,0.5); transition: transform 0.25s, box-shadow 0.25s;
    border: 1px solid rgba(201,162,39,0.22); position: relative;
    opacity: 0; transform: translateY(18px); animation: fadeUp 0.5s forwards; }
  @keyframes fadeUp { to { opacity: 1; transform: none; } }
  .card:hover { transform: translateY(-5px); box-shadow: 0 16px 34px rgba(201,162,39,0.18); }
  .card .imgwrap { overflow: hidden; position: relative; }
  .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; transition: transform 0.4s; }
  .card:hover img { transform: scale(1.06); }
  .badge { position: absolute; top: 0.8rem; left: 0.8rem; font-size: 0.72rem; font-weight: 700;
    padding: 0.32rem 0.75rem; border-radius: 99px; letter-spacing: 0.03rem; z-index: 2; }
  [dir="rtl"] .badge { left: auto; right: 0.8rem; }
  .badge.best { background: linear-gradient(135deg, var(--gold-l), var(--gold-d)); color: #0d0b08;
    box-shadow: 0 4px 12px rgba(201,162,39,0.4); }
  .badge.new { background: var(--green); color: #fff; }
  .card .info { padding: 1rem 1.1rem 1.2rem; }
  .card .cat { font-size: 0.7rem; color: var(--gold-l); text-transform: uppercase;
    letter-spacing: 0.08rem; font-weight: 700; }
  .card h3 { font-size: 1.02rem; margin: 0.3rem 0 0.25rem; color: var(--cream); }
  .card .stars { color: var(--gold-l); font-size: 0.8rem; margin-bottom: 0.4rem; }
  .card .price { color: var(--gold-l); font-weight: 700; margin-bottom: 0.8rem; }
  .card .price small { color: var(--muted); font-weight: 400; }
  .add-btn { width: 100%; background: linear-gradient(135deg, var(--gold-l), var(--gold-d)); color: #0d0b08;
    border: none; padding: 0.7rem; border-radius: 12px; font-size: 0.92rem; font-weight: 700;
    cursor: pointer; transition: filter 0.2s; }
  .add-btn:hover { filter: brightness(1.1); }
  .empty { text-align: center; color: var(--muted); padding: 3rem 0; display: none; font-size: 1.05rem; }

  /* ---------- PROMO BANNER ---------- */
  .promo { max-width: 1200px; margin: 0 auto 3.5rem; padding: 0 1.4rem; }
  .promo-box { background: linear-gradient(120deg, #0d0b08 0%, #241c0e 55%, #3a2c12 100%);
    border: 1px solid rgba(201,162,39,0.35); border-radius: 22px;
    padding: 2.4rem 2rem; display: flex; align-items: center; justify-content: space-between;
    gap: 1.5rem; color: #fff; flex-wrap: wrap; box-shadow: 0 20px 45px rgba(0,0,0,0.5); }
  .promo-box h3 { font-size: 1.5rem; margin-bottom: 0.4rem; color: var(--cream); }
  .promo-box h3 span { color: var(--gold-l); }
  .promo-box p { opacity: 0.8; font-size: 0.95rem; color: var(--ivory); }
  .promo-code { display: flex; align-items: center; gap: 0.7rem; background: rgba(201,162,39,0.1);
    border: 2px dashed var(--gold); border-radius: 14px; padding: 0.8rem 1.2rem; cursor: pointer; }
  .promo-code b { font-size: 1.25rem; letter-spacing: 0.15rem; color: var(--gold-l); }
  .promo-code small { opacity: 0.75; font-size: 0.75rem; display: block; color: var(--ivory); }

  /* ---------- TESTIMONIALS ---------- */
  .reviews { background: var(--coal); padding: 3.5rem 1.4rem; border-top: 1px solid rgba(201,162,39,0.15);
    border-bottom: 1px solid rgba(201,162,39,0.15); }
  .reviews .inner { max-width: 1100px; margin: 0 auto; }
  .rev-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2rem; margin-top: 2rem; }
  .rev { background: var(--coal2); border: 1px solid rgba(201,162,39,0.2); border-radius: 16px;
    padding: 1.5rem; box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
  .rev .stars { color: var(--gold-l); margin-bottom: 0.7rem; font-size: 0.95rem; }
  .rev p { font-size: 0.92rem; line-height: 1.7; color: var(--ivory); margin-bottom: 1rem; font-style: italic; }
  .rev b { font-size: 0.88rem; color: var(--cream); } .rev small { color: var(--muted); font-size: 0.78rem; display: block; }

  /* ---------- NEWSLETTER ---------- */
  .news { max-width: 680px; margin: 0 auto; padding: 3.5rem 1.4rem; text-align: center; }
  .news h2 { font-size: 1.8rem; margin-bottom: 0.6rem; color: var(--cream); }
  .news p { color: var(--muted); margin-bottom: 1.4rem; }
  .news p span { color: var(--gold-l); font-weight: 700; }
  .news-form { display: flex; gap: 0.6rem; max-width: 460px; margin: 0 auto; }
  .news-form input { flex: 1; padding: 0.85rem 1.2rem; border-radius: 99px;
    border: 1.5px solid rgba(201,162,39,0.35); background: var(--coal); color: var(--cream);
    font-size: 0.95rem; outline: none; }
  .news-form input::placeholder { color: var(--muted); }
  .news-form input:focus { border-color: var(--gold); }

  /* ---------- ABOUT / FOOTER ---------- */
  .about { background: var(--coal); padding: 3.5rem 1.4rem; text-align: center;
    border-top: 1px solid rgba(201,162,39,0.15); }
  .about .inner { max-width: 680px; margin: 0 auto; }
  .about h2 { font-size: 1.9rem; margin-bottom: 1rem; color: var(--cream); }
  .about p { color: var(--muted); line-height: 1.9; }
  footer { background: #080706; color: var(--ivory); padding: 3rem 1.4rem 1.6rem; font-size: 0.9rem;
    border-top: 1px solid rgba(201,162,39,0.25); }
  .foot-grid { max-width: 1100px; margin: 0 auto 2rem; display: grid;
    grid-template-columns: repeat(3, 1fr); gap: 2rem; }
  .foot-grid h4 { color: var(--gold-l); margin-bottom: 0.9rem; font-size: 1rem; }
  .foot-grid a, .foot-grid p { color: var(--muted); text-decoration: none; display: block;
    margin-bottom: 0.55rem; line-height: 1.6; }
  .foot-grid a:hover { color: var(--gold-l); }
  .foot-bottom { max-width: 1100px; margin: 0 auto; padding-top: 1.4rem;
    border-top: 1px solid rgba(201,162,39,0.2); text-align: center; color: var(--muted); font-size: 0.82rem; }
  .foot-bottom a { color: inherit; opacity: 0.55; text-decoration: none; }
  .foot-bottom a:hover { opacity: 1; color: var(--gold-l); }

  /* ---------- DRAWER (cart) ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 90;
    opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(430px, 94vw);
    background: var(--coal); z-index: 100; transform: translateX(105%);
    transition: transform 0.3s ease; display: flex; flex-direction: column;
    box-shadow: -20px 0 50px rgba(0,0,0,0.5); border-left: 1px solid rgba(201,162,39,0.25); color: var(--cream); }
  .drawer.show { transform: translateX(0); }
  [dir="rtl"] .drawer { right: auto; left: 0; transform: translateX(-105%);
    box-shadow: 20px 0 50px rgba(0,0,0,0.5); border-left: none; border-right: 1px solid rgba(201,162,39,0.25); }
  [dir="rtl"] .drawer.show { transform: translateX(0); }
  .drawer-head { display: flex; justify-content: space-between; align-items: center;
    padding: 1.2rem 1.4rem; border-bottom: 1px solid rgba(201,162,39,0.2); }
  .drawer-head h3 { font-size: 1.25rem; color: var(--cream); }
  .close-x { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--muted); }
  .close-x:hover { color: var(--gold-l); }
  .ship-bar { padding: 1rem 1.4rem 0.4rem; font-size: 0.82rem; color: var(--ivory); }
  .ship-bar .track { height: 8px; background: #2a241b; border-radius: 99px; margin-top: 0.45rem; overflow: hidden; }
  .ship-bar .fill { height: 100%; background: linear-gradient(90deg, var(--gold-d), var(--gold-l));
    border-radius: 99px; transition: width 0.4s; }
  .ship-bar b { color: var(--gold-l); }
  .drawer-items { flex: 1; overflow-y: auto; padding: 1rem 1.4rem; }
  .citem { display: flex; gap: 0.9rem; background: var(--coal2); border-radius: 12px;
    padding: 0.8rem; margin-bottom: 0.8rem; align-items: center; border: 1px solid rgba(201,162,39,0.18); }
  .citem img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; }
  .citem .mid { flex: 1; }
  .citem .mid b { font-size: 0.9rem; display: block; color: var(--cream); }
  .citem .mid small { color: var(--muted); font-size: 0.78rem; }
  .qty { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.35rem; }
  .qty button { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(201,162,39,0.4);
    background: transparent; color: var(--gold-l); cursor: pointer; font-size: 0.9rem; line-height: 1; }
  .citem .rm { background: none; border: none; color: var(--red); cursor: pointer; font-size: 1.05rem; }
  .citem .line-total { font-weight: 700; font-size: 0.88rem; white-space: nowrap; color: var(--gold-l); }
  .drawer-foot { padding: 1.1rem 1.4rem 1.3rem; border-top: 1px solid rgba(201,162,39,0.2); background: var(--coal2); }
  .promo-line { display: flex; gap: 0.5rem; margin-bottom: 0.9rem; }
  .promo-line input { flex: 1; padding: 0.6rem 0.9rem; border-radius: 10px;
    border: 1.5px solid rgba(201,162,39,0.35); background: var(--coal); color: var(--cream);
    font-size: 0.88rem; text-transform: uppercase; outline: none; }
  .promo-line button { background: var(--gold); color: #0d0b08; border: none; border-radius: 10px;
    padding: 0 1.1rem; cursor: pointer; font-weight: 700; }
  .promo-ok { font-size: 0.82rem; color: var(--green); font-weight: 600; margin: -0.4rem 0 0.8rem; }
  .drawer-foot .row { display: flex; justify-content: space-between; margin-bottom: 0.45rem; font-size: 0.93rem; color: var(--ivory); }
  .drawer-foot .row.disc { color: var(--green); font-weight: 600; }
  .drawer-foot .row.total { font-size: 1.15rem; font-weight: 700; margin: 0.7rem 0 1rem; color: var(--cream); }
  .drawer-foot .row.total span:last-child { color: var(--gold-l); }
  .drawer-foot select { width: 100%; padding: 0.65rem; border-radius: 10px;
    border: 1.5px solid rgba(201,162,39,0.35); background: var(--coal); color: var(--cream);
    margin-bottom: 0.8rem; font-size: 0.92rem; }
  .drawer-foot .btn { width: 100%; }
  .cart-empty { text-align: center; color: var(--muted); padding: 3rem 1rem; line-height: 2; }

  /* ---------- MODALS ---------- */
  .modal { position: fixed; inset: 0; z-index: 110; display: flex; align-items: center;
    justify-content: center; padding: 1rem; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .modal.show { opacity: 1; pointer-events: auto; }
  .modal-box { background: var(--coal); border: 1px solid rgba(201,162,39,0.35); border-radius: 20px;
    max-width: 480px; width: 100%; max-height: 92vh; overflow-y: auto; position: relative;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6); color: var(--cream); }
  .modal-box img.hero-img { width: 100%; height: 260px; object-fit: cover; border-radius: 20px 20px 0 0; }
  .modal-body { padding: 1.5rem 1.6rem 1.8rem; }
  .modal-body .cat { font-size: 0.72rem; color: var(--gold-l); text-transform: uppercase;
    letter-spacing: 0.08rem; font-weight: 700; }
  .modal-body h3 { font-size: 1.5rem; margin: 0.3rem 0 0.6rem; color: var(--cream); }
  .modal-body p.desc { color: var(--muted); line-height: 1.8; margin-bottom: 1.2rem; font-size: 0.95rem; }
  .wlabel { font-weight: 700; font-size: 0.9rem; margin-bottom: 0.5rem; display: block; color: var(--ivory); }
  .size-tag { display: inline-block; background: rgba(201,162,39,0.12); border: 1px solid rgba(201,162,39,0.4);
    color: var(--gold-l); border-radius: 99px; padding: 0.45rem 1.1rem; font-weight: 700; font-size: 0.9rem;
    margin-bottom: 1.2rem; }
  .buy-row { display: flex; gap: 0.8rem; align-items: center; }
  .buy-row .qty { margin: 0; }
  .buy-row .qty button { width: 34px; height: 34px; font-size: 1.1rem; }
  .buy-row .qty span { font-size: 1.1rem; font-weight: 700; min-width: 24px; text-align: center; color: var(--cream); }
  .buy-row .btn { flex: 1; }
  .modal .close-x { position: absolute; top: 0.7rem; right: 0.9rem; z-index: 2;
    background: rgba(13,11,8,0.85); border: 1px solid rgba(201,162,39,0.4); border-radius: 50%;
    width: 34px; height: 34px; color: var(--gold-l); }
  [dir="rtl"] .modal .close-x { right: auto; left: 0.9rem; }

  .form-group { margin-bottom: 0.9rem; }
  .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem; color: var(--ivory); }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.7rem 0.9rem;
    border-radius: 10px; border: 1.5px solid rgba(201,162,39,0.35); font-size: 0.95rem;
    background: var(--coal2); color: var(--cream); outline: none; }
  .form-group input::placeholder, .form-group textarea::placeholder { color: var(--muted); }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--gold); }

<div class="announce" id="announceBar"></div>

<nav>

<div class="trust">

<section class="reviews" id="reviews">

let LANG = 'ar';
try { LANG = localStorage.getItem('rona_lang') || 'ar'; } catch(e) { LANG = 'ar'; }
if (!I18N[LANG]) LANG = 'ar';
const t = k => (I18N[LANG] && I18N[LANG][k] !== undefined) ? I18N[LANG][k] : (I18N.ar[k] !== undefined ? I18N.ar[k] : k);
const L = o => { if (!o) return ''; if (typeof o === 'string') return o; return o[LANG] || o.ar || o.fr || o.en || ''; };
const fill = (s, m) => String(s).replace(/\{(\w+)\}/g, (_, k) => (m[k] !== undefined ? m[k] : ''));

function setLang(l) {
  if (!I18N[l]) return;
  LANG = l;
  try { localStorage.setItem('rona_lang', l); } catch(e) {}
  document.documentElement.lang = l;
  document.documentElement.dir = (l === 'ar') ? 'rtl' : 'ltr';
  applyI18n();
  renderCatPills(); render(); renderCart(); applySettingsToDom();
}
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('.lang-sw button').forEach(b => b.classList.toggle('active', b.dataset.lang === LANG));
  $('revGrid').innerHTML = t('revs').map(r => `
    <div class="rev"><div class="stars">★★★★★</div><p>${r.t}</p><b>${r.n}</b><small>${r.c}</small></div>`).join('');
}

/* ---------- PLACEHOLDER ART (gold monogram on black) ---------- */
function phImg(label) {
  const ch = ((label || 'R').trim().charAt(0) || 'R').toUpperCase();
  const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'>" +
    "<defs><radialGradient id='g' cx='50%' cy='38%' r='65%'>" +
    "<stop offset='0%' stop-color='#3a2f16'/><stop offset='60%' stop-color='#171208'/><stop offset='100%' stop-color='#0d0b08'/>" +
    "</radialGradient><linearGradient id='gl' x1='0' y1='0' x2='1' y2='1'>" +
    "<stop offset='0%' stop-color='#e8c766'/><stop offset='100%' stop-color='#9a7b1c'/></linearGradient></defs>" +
    "<rect width='600' height='600' fill='url(#g)'/>" +
    "<rect x='26' y='26' width='548' height='548' fill='none' stroke='url(#gl)' stroke-width='3'/>" +
    "<rect x='40' y='40' width='520' height='520' fill='none' stroke='url(#gl)' stroke-width='1' opacity='0.6'/>" +
    "<text x='300' y='330' text-anchor='middle' font-family='Georgia,serif' font-size='220' fill='url(#gl)'>" + ch + "</text>" +
    "<text x='300' y='470' text-anchor='middle' font-family='Georgia,serif' font-size='34' letter-spacing='12' fill='#c9a227'>RONA SHOP</text>" +
    "<text x='300' y='120' text-anchor='middle' font-size='30' fill='#c9a227'>✦</text></svg>";
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
function imgFor(p) {
  const n = (p.img || '').trim();
  if (/^https?:\/\//i.test(n) || n.indexOf('data:') === 0) return n;
  const hit = (window.IMGS || {})[n];
  if (hit) return hit;
  return phImg(L(p.name));
}

/* ---------- SHOP GRID ---------- */
function renderCatPills() {
  $('catPills').innerHTML = Object.keys(CATS).map(k =>
    `<button class="pill${activeCat===k?' active':''}" data-cat="${k}">${L(CATS[k])}</button>`).join('');
  document.querySelectorAll('.pill[data-cat]').forEach(b =>
    b.addEventListener('click', () => {
      document.querySelectorAll('.pill[data-cat]').forEach(x => x.classList.remove('active'));
      b.classList.add('active'); activeCat = b.dataset.cat; render();
    }));
}
function render() {
  const q = $('search').value.toLowerCase().trim();
  const list = PRODUCTS.filter(p => {
    const nm = (L(p.name) + ' ' + (p.name.ar||'') + ' ' + (p.name.fr||'') + ' ' + (p.name.en||'')).toLowerCase();
    return (activeCat === 'all' || p.cat === activeCat) && (!q || nm.includes(q));
  });
  $('grid').innerHTML = list.map((p, i) => `
    <div class="card" style="animation-delay:${Math.min(i*0.05, 0.4)}s" onclick="openProduct('${p.id}')">
      <div class="imgwrap">
        <img src="${imgFor(p)}" alt="${escAttr(L(p.name))}" loading="lazy">
        ${BADGE_HTML(L(p.badge))}
      </div>
      <div class="info">
        <div class="cat">${L(CATS[p.cat]) || p.cat}</div>
        <h3>${escHtml(L(p.name))}</h3>
        <div class="stars">${p.rating || '★★★★★'}</div>
        <div class="price">${fmt(p.price)} <small>/ ${escHtml(p.size || '')}</small></div>
        <button class="add-btn" onclick="event.stopPropagation(); quickAdd('${p.id}')">+ ${t('pm_add')}</button>
      </div>
    </div>`).join('');
  $('empty').style.display = list.length ? 'none' : 'block';
}
function escHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return escHtml(s).replace(/"/g,'&quot;'); }
$('search').addEventListener('input', render);

/* ---------- PRODUCT MODAL ---------- */
function openProduct(id) {
  pmProduct = PRODUCTS.find(p => p.id === id);
  if (!pmProduct) return;
  pmQty = 1;
  $('pmImg').src = imgFor(pmProduct);
  $('pmCat').textContent = L(CATS[pmProduct.cat]) || pmProduct.cat;
  $('pmName').textContent = L(pmProduct.name);
  $('pmStars').textContent = (pmProduct.rating || '★★★★★') + ' · ' + t('pm_reviews');
  $('pmDesc').textContent = L(pmProduct.desc);
  $('pmSize').textContent = pmProduct.size || '';
  $('pmQty').textContent = pmQty;
  pmUpdatePrice();
  $('overlay').classList.add('show');
  $('productModal').classList.add('show');
}
function pmQtyChange(d) { pmQty = Math.max(1, Math.min(20, pmQty + d)); $('pmQty').textContent = pmQty; pmUpdatePrice(); }
function pmUpdatePrice() { $('pmAdd').textContent = t('pm_add') + ' · ' + fmt(pmProduct.price * pmQty); }
function pmAddToCart() { addToCart(pmProduct.id, pmQty); closeAll(); }
function quickAdd(id) { addToCart(id, 1); }

/* ---------- CART ---------- */
function addToCart(id, qty) {
  const found = cart.find(i => i.id === id);
  if (found) found.qty = Math.min(20, found.qty + qty);
  else cart.push({ id, qty });
  save(); updateBadge();
  const p = PRODUCTS.find(p => p.id === id);
  toast(fill(t('toast_added'), { p: L(p.name) }));
}
function updateBadge() { $('cartCount').textContent = cart.reduce((s, i) => s + i.qty, 0); }
function subTotal() {
  return cart.reduce((s, i) => { const p = PRODUCTS.find(p => p.id === i.id); return s + (p ? p.price * i.qty : 0); }, 0);
}
function discount() { return subTotal() * promoRate; }
function shipFor(city) {
  if (!city) return null;
  if (subTotal() - discount() >= FREE_SHIPPING_FROM) return 0;
  return SHIPPING[city] !== undefined ? SHIPPING[city] : SHIPPING['Autre ville'];
}
function openCart() { renderCart(); $('overlay').classList.add('show'); $('drawer').classList.add('show'); }
function renderCart() {
  const box = $('cartItems');
  if (!cart.length) {
    box.innerHTML = '<div class="cart-empty">' + t('cart_empty') + '</div>';
    $('cartFoot').style.display = 'none'; $('shipBar').style.display = 'none';
    return;
  }
  $('cartFoot').style.display = 'block';
  box.innerHTML = cart.map((i, idx) => {
    const p = PRODUCTS.find(p => p.id === i.id);
    if (!p) return '';
    return `<div class="citem">
      <img src="${imgFor(p)}" alt="">
      <div class="mid">
        <b>${escHtml(L(p.name))}</b><small>${escHtml(p.size || '')} · ${fmt(p.price)}</small>
        <div class="qty">
          <button onclick="chQty(${idx},-1)">−</button><span>${i.qty}</span><button onclick="chQty(${idx},1)">+</button>
        </div>
      </div>
      <div class="line-total">${fmt(p.price * i.qty)}</div>
      <button class="rm" onclick="rmItem(${idx})">🗑</button>
    </div>`;
  }).join('');

  const net = subTotal() - discount();
  const bar = $('shipBar');
  bar.style.display = 'block';
  if (net >= FREE_SHIPPING_FROM) {
    $('shipMsg').innerHTML = t('ship_unlocked');
    $('shipFill').style.width = '100%';
  } else {
    $('shipMsg').innerHTML = fill(t('ship_more'), { n: fmt(FREE_SHIPPING_FROM - net) });
    $('shipFill').style.width = Math.min(100, net / FREE_SHIPPING_FROM * 100) + '%';
  }

  const hasDisc = discount() > 0;
  $('discRow').style.display = hasDisc ? 'flex' : 'none';
  if (hasDisc) { $('discCode').textContent = '(' + promoCode + ')'; $('discVal').textContent = '−' + fmt(discount()); }

  const city = $('citySelect').value, ship = shipFor(city);
  $('subTotal').textContent = fmt(subTotal());
  $('shipCost').textContent = ship === null ? '—' : (ship === 0 ? t('free') : fmt(ship));
  $('grandTotal').textContent = fmt(net + (ship || 0));
}
function chQty(idx, d) {
  cart[idx].qty += d;
  if (cart[idx].qty < 1) cart.splice(idx, 1);
  else cart[idx].qty = Math.min(20, cart[idx].qty);
  save(); updateBadge(); renderCart();
}
function rmItem(idx) { cart.splice(idx, 1); save(); updateBadge(); renderCart(); }
function applyPromo() {
  const code = $('promoInput').value.trim().toUpperCase();
  if (PROMOS[code]) {
    promoRate = PROMOS[code]; promoCode = code;
    $('promoOk').style.display = 'block';
    $('promoOk').textContent = fill(t('promo_ok'), { c: code, p: Math.round(promoRate * 100) });
    toast(fill(t('promo_ok'), { c: code, p: Math.round(promoRate * 100) }));
  } else {
    promoRate = 0; promoCode = '';
    $('promoOk').style.display = 'none';
    toast(t('promo_bad'));
  }
  renderCart();
}

/* ---------- CHECKOUT ---------- */
function openCheckout() {
  if (!cart.length) return;
  closeAll();
  const fCity = $('fCity');
  fCity.innerHTML = Object.keys(SHIPPING).map(c => `<option>${escHtml(c)}</option>`).join('');
  if ($('citySelect').value) fCity.value = $('citySelect').value;
  fCity.onchange = updateRecap;
  updateRecap();
  $('overlay').classList.add('show');
  $('checkoutModal').classList.add('show');
}
function updateRecap() {
  const city = $('fCity').value, net = subTotal() - discount(), ship = shipFor(city);
  const lines = cart.map(i => {
    const p = PRODUCTS.find(p => p.id === i.id);
    return p ? `<div class="row"><span>${escHtml(L(p.name))} × ${i.qty}</span><span>${fmt(p.price * i.qty)}</span></div>` : '';
  }).join('');
  $('recap').innerHTML = lines +
    (discount() > 0 ? `<div class="row disc"><span>${t('discount')} (${escHtml(promoCode)})</span><span>−${fmt(discount())}</span></div>` : '') +
    `<div class="row"><span>${t('shipping')} (${escHtml(city)})</span><span>${ship === 0 ? t('free') : fmt(ship)}</span></div>` +
    `<div class="row total"><span>${t('total')}</span><span>${fmt(net + ship)}</span></div>`;
}
function submitOrder() {
  const name = $('fName').value.trim(), phone = $('fPhone').value.trim(),
        city = $('fCity').value, addr = $('fAddr').value.trim(), note = $('fNote').value.trim();
  if (!name || !phone || !addr) { toast(t('toast_fill')); return; }
  const net = subTotal() - discount(), ship = shipFor(city), total = net + ship;
  const lines = cart.map(i => {
    const p = PRODUCTS.find(p => p.id === i.id);
    return p ? `• ${L(p.name)} × ${i.qty} = ${p.price * i.qty} ${t('currency')}` : '';
  });
  const msg =
`✦ *${t('wa_title')} — ${STORE_NAME}*
━━━━━━━━━━━━
${lines.join('\n')}
━━━━━━━━━━━━
${t('wa_subtotal')}: ${fmt(subTotal())}` +
(discount() > 0 ? `\n${t('wa_disc')} (${promoCode}): −${fmt(discount())}` : '') +
`
${t('wa_ship')} (${city}): ${ship === 0 ? t('wa_free') : fmt(ship)}
*${t('wa_total')}: ${fmt(total)}*
━━━━━━━━━━━━
👤 ${name}
📞 ${phone}
📍 ${addr}, ${city}` + (note ? `\n📝 ${note}` : '') +
`\n━━━━━━━━━━━━
💵 ${t('wa_cod')}`;
  window.open('https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(msg), '_blank');
  cart = []; promoRate = 0; promoCode = ''; $('promoInput').value = ''; $('promoOk').style.display = 'none';
  save(); updateBadge(); closeAll();
  toast(t('toast_sent'));
}

/* ---------- MISC ---------- */
function activePromoCode(){ return Object.keys(PROMOS)[0] || ''; }
function activePromoPct(){ return Math.round((PROMOS[activePromoCode()] || 0) * 100); }
function copyCode() {
  const c = activePromoCode();
  const done = () => toast(fill(t('toast_copied'), { c }));
  if (navigator.clipboard) navigator.clipboard.writeText(c).then(done).catch(done);
  else done();
}
function subscribeNews(e) {
  e.preventDefault();
  if (!$('newsEmail').value.trim()) return false;
  $('newsEmail').value = '';
  toast(fill(t('toast_news'), { c: activePromoCode(), p: activePromoPct() }));
  return false;
}
function closeAll() {
  $('overlay').classList.remove('show');
  $('drawer').classList.remove('show');
  $('productModal').classList.remove('show');
  $('checkoutModal').classList.remove('show');
}
let toastT;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2600);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });

/* ---------- FIREBASE ---------- */
function applyShopData(data) {
  const s = data.settings || {};
  if (s.storeName) STORE_NAME = String(s.storeName);
  if (s.whatsapp) WHATSAPP_NUMBER = String(s.whatsapp).replace(/\D/g, '') || WHATSAPP_NUMBER;
  if (s.announce && typeof s.announce === 'object') ANNOUNCE = s.announce;
  else if (typeof s.announce === 'string' && s.announce) ANNOUNCE = { ar: s.announce, fr: s.announce, en: s.announce };
  if (s.freeShip) FREE_SHIPPING_FROM = Number(s.freeShip) || FREE_SHIPPING_FROM;
  if (s.promo) PROMOS = { [String(s.promo).toUpperCase()]: (Number(s.pct) || 0) / 100 };
  if (s.fees && typeof s.fees === 'object') SHIPPING = s.fees;
  if (Array.isArray(data.products) && data.products.length) PRODUCTS = data.products;
}
function applySettingsToDom() {
  $('announceBar').innerHTML = L(ANNOUNCE);
  $('promoCodeLbl').textContent = activePromoCode();
  const pct = activePromoPct();
  $('promoInput').placeholder = t('promo_ph') + ' (' + activePromoCode() + ')';
  $('footShip').textContent = t('free') + ' ' + t('shipping') + ' ' + fmt(FREE_SHIPPING_FROM) + '+';
  $('footCopy').textContent = STORE_NAME;
  $('statCount').textContent = PRODUCTS.length + '+';
  $('citySelect').innerHTML = `<option value="">${t('city_ph')}</option>` +
    Object.keys(SHIPPING).map(c => `<option>${escHtml(c)}</option>`).join('');
  const heroP = PRODUCTS[0];
  $('heroImg').src = heroP ? imgFor(heroP) : phImg('R');
  $('heroImg').alt = heroP ? L(heroP.name) : 'Rona shop';
}

/* ---------- INIT ---------- */
async function init() {
  document.documentElement.lang = LANG;
  document.documentElement.dir = (LANG === 'ar') ? 'rtl' : 'ltr';
  try {
    const cfg = window.FIREBASE_CONFIG;
    if (window.FIREBASE_ENABLED && cfg && cfg.apiKey && cfg.apiKey !== 'PASTE_HERE' && window.firebase) {
      firebase.initializeApp(cfg);
      const snap = await firebase.database().ref('/shop').get();
      if (snap.exists()) applyShopData(snap.val());
    }
  } catch(e) { /* demo mode: keep defaults */ }
  cart = cart.filter(i => PRODUCTS.some(p => p.id === i.id));
  save();
  applyI18n();
  renderCatPills();
  applySettingsToDom();
  updateBadge();
  render();
}
init();
</script>
</body>
</html>
